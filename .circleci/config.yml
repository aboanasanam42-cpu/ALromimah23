version: 2.1

orbs:
  android: circleci/android@2.4.0

jobs:
  independent_circleci_build:
    executor:
      - name: android/android-machine
    resource_class: large
    steps:
      - checkout
      - android/restore-gradle-cache
      - run:
          name: Setup Keystore from Base64
          command: |
            echo "$CM_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
            printf 'storePassword=%s\n' "$CM_KEYSTORE_PASSWORD" > key.properties
            printf 'keyPassword=%s\n' "$CM_KEY_PASSWORD" >> key.properties
            printf 'keyAlias=%s\n' "$CM_KEY_ALIAS" >> key.properties
            printf 'storeFile=/tmp/upload-keystore.jks\n' >> key.properties
      - run:
          name: Run Lint & Compile Release APK
          command: ./gradlew assembleRelease
      - store_artifacts:
          path: app/build/outputs/apk/release/
          destination: signed-apks
      - android/save-gradle-cache
      - run:
          name: Chunk AI Failure Handler
          command: |
            echo "CircleCI build failed! Activating Chunk AI to heal code or configurations..."
          when: on_fail

workflows:
  version: 2
  circleci_standalone_pipeline:
    jobs:
      - independent_circleci_build
