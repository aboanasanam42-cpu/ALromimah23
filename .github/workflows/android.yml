name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore if available
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APK
        shell: bash
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${CM_KEYSTORE_PASSWORD}" ] && [ -n "${CM_KEY_ALIAS}" ] && [ -n "${CM_KEY_PASSWORD}" ]; then
            echo "Signing secrets found; building signed release APK"
            ./gradlew assembleRelease --stacktrace
            echo "APK_DIR=app/build/outputs/apk/release" >> "$GITHUB_ENV"
          else
            echo "Signing secrets not found; building debug APK as fallback"
            ./gradlew assembleDebug --stacktrace
            echo "APK_DIR=app/build/outputs/apk/debug" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-${{ github.run_number }}
          path: ${{ env.APK_DIR }}/**/*.apk
          if-no-files-found: error
