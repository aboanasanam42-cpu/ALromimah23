name: Build and Release Android APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Custom release tag (optional, e.g. v2.0.142)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  build-and-release:
    name: Build APK, Verify & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages (API ${{ env.ANDROID_API }})
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_HOME}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Prepare Gradle Environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Install Web Dependencies & Build Assets
        run: |
          npm install
          npm run lint
          npm run build

      - name: Configure Keystore Signing (if secret available)
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-upload.jks
            cat > app/key.properties <<EOF
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyPassword=${RELEASE_KEY_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          storeFile=release-upload.jks
          EOF
            echo "Production release signing configured."
          else
            echo "No custom production keystore found in secrets; Gradle fallback signing will be applied."
          fi

      - name: Ensure Google Services Configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "app/google-services.json" ]; then
            echo "Provisioning standard google-services.json..."
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "574862521859",
              "project_id": "building-git-53976479-71cea",
              "storage_bucket": "building-git-53976479-71cea.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:574862521859:android:35909115c4355a4b104036",
                  "android_client_info": {
                    "package_name": "com.marium.aiworkspace"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "574862521859-i9cf8qibmab4e2539gvkvsgrgfqjnhfl.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.marium.aiworkspace",
                      "certificate_hash": "62129cf6074ee8aa9bbbbdfb2aa48380fb19b92c"
                    }
                  },
                  {
                    "client_id": "574862521859-ddbfg3ugfamb48odo9id1s8ejjb1pnst.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBEv4LC9XIL_qEzeA_rvhYmpZhiezB8Z_c"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "574862521859-ddbfg3ugfamb48odo9id1s8ejjb1pnst.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          test -s app/google-services.json

      - name: Build Android Debug & Release APKs
        run: ./gradlew clean assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Organize Artifacts & Calculate Checksums
        id: organize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          
          # Copy APKs
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Marium-AI-Workspace-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/Marium-AI-Workspace-release.apk
          
          # Generate SHA256 checksums
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          # Determine Tag Name
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v2.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Marium-AI-Workspace-APKs-${{ steps.organize.outputs.tag_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.organize.outputs.tag_name }}
          name: Marium AI Workspace ${{ steps.organize.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # 🚀 Marium AI Workspace — ${{ steps.organize.outputs.tag_name }}

            Professional remote work AI assistant Android application build.

            ### 📦 Direct Downloads:
            - 🔹 **[Release APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.organize.outputs.tag_name }}/Marium-AI-Workspace-release.apk)** (Optimized Production)
            - 🔹 **[Debug APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.organize.outputs.tag_name }}/Marium-AI-Workspace-debug.apk)** (Development & Testing)
            - 🔹 **[SHA256 Checksums](https://github.com/${{ github.repository }}/releases/download/${{ steps.organize.outputs.tag_name }}/SHA256SUMS.txt)**

            ---
            ### 🛠 Features & Modules Included:
            - **AI Engine**: Opportunity analysis, intelligent proposal generation, and scoring matrix.
            - **Fraud Detection**: Real-time evaluation against fake job posts and scam indicators.
            - **Secure Storage**: AES-256 GCM KeyStore hardware-backed encryption.
            - **Cloud Synchronization**: Firestore sync & automated encrypted backups.
            - **UI & Localization**: Arabic RTL native Jetpack Compose & modern design system.
          files: |
            release-artifacts/Marium-AI-Workspace-release.apk
            release-artifacts/Marium-AI-Workspace-debug.apk
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
