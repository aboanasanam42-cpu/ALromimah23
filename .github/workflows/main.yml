name: Build Android APK & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

    - name: Prepare local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Make Gradle Wrapper Executable and Verify JAR
      run: |
        chmod +x gradlew
        if [ ! -s gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
          echo "Restoring official Gradle Wrapper JAR..."
          mkdir -p gradle/wrapper
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Ensure Android Configuration Files Exist
      run: |
        if [ ! -f app/google-services.json ]; then
          echo "Restoring google-services.json..."
          echo '{"project_info":{"project_number":"574862521859","project_id":"building-git-53976479-71cea","storage_bucket":"building-git-53976479-71cea.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:574862521859:android:35909115c4355a4b104036","android_client_info":{"package_name":"com.marium.aiworkspace"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyBEv4LC9XIL_qEzeA_rvhYmpZhiezB8Z_c"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
        fi

    - name: Build Android APK
      run: |
        ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare APK Outputs
      run: |
        mkdir -p apks-dist
        find app/build/outputs/apk -name "*.apk" -exec cp {} apks-dist/ \;
        echo "=== Generated APK Files ==="
        ls -la apks-dist/

    - name: Set up Node.js for Web Bundle
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Web Application Bundle
      run: |
        npm ci || npm install
        npm run build || true
        mkdir -p apks-dist/web-bundle
        cp -r dist apks-dist/web-bundle/ 2>/dev/null || true
        zip -r apks-dist/maria-web-app.zip dist/ 2>/dev/null || true

    - name: Upload APK & Web Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Maria-AI-Workspace-APK-v1.0.${{ github.run_number }}
        path: apks-dist/

    - name: Create GitHub Release with APK
      if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}-apk
        name: 📱 Maria AI Workspace APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 تطبيق مريم AI - مساحة العمل الذكية (Android APK)
          تم بناء التطبيق بنجاح عبر GitHub Actions. يمكنك تحميل وتثبيت ملف الـ APK مباشرة على هاتفك الأندرويد.

          #### ✨ المزايا المضمنة في هذا الإصدار:
          - **المجالات الـ 10 الكاملة للعمل عن بُعد**: الحسابات والمالية، إدارة المشاريع، الذكاء الاصطناعي والأتمتة، التصميم والمونتاج، الترجمة واللغات، الدعم الفني، التسويق الرقمي، تطوير البرمجيات، الكتابة وصناعة المحتوى، الاستشارات والتدريب.
          - **نظام تحليل الفرص وتوليد العروض بالذكاء الاصطناعي**.
          - **التكامل السحابي والأمان وبصمات Firebase**.

          #### 📥 روابط التحميل المباشرة:
          - **تحميل ملف التثبيت المباشر (APK)**: تجد الملفات أدناه تحت قسم Assets (`app-release.apk` / `app-debug.apk`).
        draft: false
        prerelease: false
        files: |
          apks-dist/*.apk
          apks-dist/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
