name: CloudWorker AI CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  KEYSTORE_PASSWORD: cloudworker
  KEY_ALIAS: release
  KEY_PASSWORD: cloudworker

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build:web

    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app
        path: dist/

  build-android:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build:web

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # =============================================
    # Android SDK — Manual Installation
    # =============================================
    - name: Install Android SDK (manual)
      run: |
        echo "=== Creating Android SDK directory ==="
        mkdir -p $ANDROID_HOME/cmdline-tools

        echo "=== Downloading Android Command Line Tools ==="
        curl -L -o /tmp/cmdline-tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip

        echo "=== Extracting Command Line Tools ==="
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        echo "=== Adding SDK to PATH ==="
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2

        echo "=== Accepting Android Licenses ==="
        yes | sdkmanager --licenses || true

        echo "=== Installing SDK Packages ==="
        sdkmanager "cmdline-tools;latest"
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-33"
        sdkmanager "build-tools;33.0.2"

        echo "=== Verifying Installation ==="
        sdkmanager --list_installed
        adb --version || true
    # =============================================

    # =============================================
    # Generate Signing Keystores
    # =============================================
    - name: Generate Debug Keystore
      run: |
        cd android/app
        keytool -genkey -v \
          -keystore debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        echo "Debug keystore created at: $(pwd)/debug.keystore"

    - name: Generate Release Keystore
      run: |
        cd android/app
        keytool -genkey -v \
          -keystore my-release-key.jks \
          -alias release \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass cloudworker \
          -keypass cloudworker \
          -dname "CN=CloudWorker AI,O=CloudWorker,C=SA"
        echo "Release keystore created at: $(pwd)/my-release-key.jks"
    # =============================================

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CloudWorker-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Build Release APK (signed)
      run: cd android && ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: CloudWorker-Release-APK
        path: android/app/build/outputs/apk/release/*.apk

    - name: Create Release
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: CloudWorker AI v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
