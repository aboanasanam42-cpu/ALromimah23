name: Maria AI App Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Build Web & Server Production Assets
      run: npm run build

    - name: Package Release Bundle
      run: |
        mkdir -p release-bundle
        cp -r dist release-bundle/
        cp package.json server.ts .env.example release-bundle/
        zip -r maria-ai-app-v1.0.${{ github.run_number }}.zip release-bundle/ dist/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Maria-AI-Production-Bundle
        path: |
          maria-ai-app-v1.0.${{ github.run_number }}.zip
          dist/

    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Maria AI Workspace Release v1.0.${{ github.run_number }}
        body: |
          ### 🚀 Marium AI Workspace - الإصدار الرسمي المكتمل
          - **المجالات الـ 10 الكاملة**: الحسابات، إدارة المشاريع، الذكاء الاصطناعي، التصميم، الترجمة، التعليم، وغيرها.
          - **محرك توليد العروض والمقترحات**: صياغة ذكية بالـ AI مخصصة للعملاء.
          - **بصمات أمان الأندرويد وFirebase**:
            - SHA-1: `62:12:9C:F6:07:4E:E8:AA:9B:BB:BD:FB:2A:A4:83:80:FB:19:B9:2C`
            - SHA-256: `13:78:40:C8:8D:07:E3:26:F9:06:35:4C:C0:79:18:20:DF:4A:A8:38:19:5D:71:A2:2E:B2:AD:65:D8:6B:FF:B5`
            - MD5: `E7:A0:1E:94:EE:F4:A0:AD:E5:1C:DE:24:8E:BD:FC:53`
        draft: false
        prerelease: false
        files: |
          maria-ai-app-v1.0.${{ github.run_number }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
