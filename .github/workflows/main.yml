name: Marium AI Workspace CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  KEYSTORE_PASSWORD: cloudworker
  KEY_ALIAS: release
  KEY_PASSWORD: cloudworker

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: تثبيت الحزم
        run: npm ci
      - name: فحص TypeScript
        run: npm run lint
      - name: بناء نسخة الويب
        run: npm run build:web
      - name: حفظ نسخة الويب
        uses: actions/upload-artifact@v4
        with:
          name: marium-web
          path: dist/

  build-android:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: تثبيت الحزم
        run: npm ci
      - name: فحص TypeScript
        run: npm run lint
      - name: بناء الواجهة
        run: npm run build:web
      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: تثبيت Android SDK 35
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: إنشاء مفاتيح البناء المؤقتة
        run: |
          cd android/app
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=YE"
          keytool -genkeypair -v -keystore my-release-key.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass cloudworker -keypass cloudworker -dname "CN=Marium AI Workspace,O=Marium,C=YE"
      - name: مزامنة Capacitor
        run: npx cap sync android
      - name: صلاحية Gradle
        run: chmod +x android/gradlew
      - name: بناء APK تجريبي
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: حفظ APK التجريبي
        uses: actions/upload-artifact@v4
        with:
          name: Marium-AI-Workspace-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
      - name: بناء APK الإصدار
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: حفظ APK الإصدار
        uses: actions/upload-artifact@v4
        with:
          name: Marium-AI-Workspace-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
      - name: إنشاء إصدار GitHub مع رابط التحميل
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Marium AI Workspace v2.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
