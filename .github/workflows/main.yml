name: Marium AI Workspace CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Validate, build and publish Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager was not installed"; exit 1; }
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_HOME}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Install web dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Configure release signing when secrets are available
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-upload.jks
            cat > app/key.properties <<EOF
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyPassword=${RELEASE_KEY_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          storeFile=release-upload.jks
          EOF
            echo "Production signing keystore configured from GitHub Secrets."
          else
            echo "No production keystore secret configured; release APK will use the non-production fallback signing configuration."
          fi

      - name: Ensure Google Services configuration is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json..."
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "574862521859",
              "project_id": "building-git-53976479-71cea",
              "storage_bucket": "building-git-53976479-71cea.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:574862521859:android:35909115c4355a4b104036",
                  "android_client_info": {
                    "package_name": "com.marium.aiworkspace"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "574862521859-i9cf8qibmab4e2539gvkvsgrgfqjnhfl.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.marium.aiworkspace",
                      "certificate_hash": "62129cf6074ee8aa9bbbbdfb2aa48380fb19b92c"
                    }
                  },
                  {
                    "client_id": "574862521859-ddbfg3ugfamb48odo9id1s8ejjb1pnst.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBEv4LC9XIL_qEzeA_rvhYmpZhiezB8Z_c"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "574862521859-ddbfg3ugfamb48odo9id1s8ejjb1pnst.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          test -s app/google-services.json
          chmod +x gradlew

      - name: Build Android debug and release APKs
        run: ./gradlew clean assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          mkdir -p apks-dist
          cp app/build/outputs/apk/debug/app-debug.apk apks-dist/Marium-AI-Workspace-debug.apk
          cp app/build/outputs/apk/release/app-release.apk apks-dist/Marium-AI-Workspace-release.apk
          cp -r dist apks-dist/web-bundle
          (cd apks-dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh apks-dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Marium-AI-Workspace-${{ github.run_number }}
          path: apks-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Marium AI Workspace v2.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## مريم AI — مساحة العمل الذكية

            إصدار Android تم التحقق من بنائه عبر GitHub Actions.

            ### الملفات
            - `Marium-AI-Workspace-release.apk` — نسخة الإصدار.
            - `Marium-AI-Workspace-debug.apk` — نسخة الاختبار.
            - `SHA256SUMS.txt` — بصمات الملفات للتحقق من سلامة التنزيل.
            - `web-bundle/` — نسخة تطبيق الويب.

            ### الوظائف الأساسية
            - اكتشاف فرص العمل عن بُعد.
            - تقييم الفرص ومؤشرات الاحتيال.
            - تحليل AI وتوليد عروض العمل.
            - إدارة المشاريع والتسليم.
            - إدارة بيانات الدفع والأرباح.
            - المزامنة السحابية.
            - واجهة عربية RTL.
          files: |
            apks-dist/*.apk
            apks-dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
