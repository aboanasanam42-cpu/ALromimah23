<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="16 8" stroke-opacity="0.4" />

  <!-- Central Emblem - Geometric Stylized M for Marium / CloudWorker AI -->
  <path d="M 140 360 L 140 180 Q 140 160 160 160 Q 175 160 188 175 L 256 265 L 324 175 Q 337 160 352 160 Q 372 160 372 180 L 372 360" 
        fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <path d="M 140 360 L 140 180 Q 140 160 160 160 Q 175 160 188 175 L 256 265 L 324 175 Q 337 160 352 160 Q 372 160 372 180 L 372 360" 
        fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- AI Sparkle Core -->
  <circle cx="256" cy="180" r="18" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M 256 146 L 260 174 L 288 180 L 260 186 L 256 214 L 252 186 L 224 180 L 252 174 Z" fill="#ffffff" />

  <!-- Star accents -->
  <circle cx="150" cy="130" r="8" fill="#34d399" opacity="0.8" />
  <circle cx="365" cy="130" r="6" fill="#818cf8" opacity="0.8" />
  <circle cx="256" cy="390" r="10" fill="#10b981" />
  <circle cx="200" cy="390" r="5" fill="#34d399" opacity="0.6" />
  <circle cx="312" cy="390" r="5" fill="#34d399" opacity="0.6" />
</svg>
